name: Monitor DOU

on:
  schedule:
    # 15:00 UTC = 12:00 em Brasília. O GitHub às vezes atrasa execuções agendadas;
    # rodar ao meio-dia garante o resultado pronto antes das 14h.
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      data:
        description: "Data (AAAA-MM-DD). Deixe vazio para hoje."
        required: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Buscar palavras no DOU
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
          # Seções do DOU a incluir (1, 2, 3 ou combinações como 1,3). Extras vêm junto.
          SECOES: "1,2,3"
        run: python dou_monitor.py ${{ github.event.inputs.data }}

      - name: Salvar resultados no repositório
        run: |
          git config user.name "monitor-dou"
          git config user.email "monitor-dou@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "Resultados DOU $(date -u +%F)"
          git push

      - name: Enviar relatório por e-mail
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
        run: |
          DATA="${{ github.event.inputs.data }}"
          [ -z "$DATA" ] && DATA=$(TZ=America/Sao_Paulo date +%F)
          set +e
          python enviar_email.py "$DATA"
          COD=$?
          set -e
          # 0 = enviado pelo Gmail; 1 = nada a enviar. Senão (Gmail não configurado ou falhou), usa o aviso do GitHub.
          if [ "$COD" = "0" ] || [ "$COD" = "1" ]; then exit 0; fi
          python dou_monitor_aviso.py "$DATA" "${{ github.repository_owner }}" aviso || exit 0
          URL=$(gh issue create --title "$(cat aviso/titulo.txt)" --body-file aviso/parte1.md)
          for f in $(ls aviso/parte*.md | sort -V | tail -n +2); do
            gh issue comment "$URL" --body-file "$f"
          done
